# ---------------------------------------------------------------------------
# NemoHeadUnit-Wireless — CI Test Suite
# Rif: docs/TEST_SUITE_ARCHITECTURE.md, docs/roadmap-current.md v3.5
#
# !! SOLO ON-DEMAND via workflow_dispatch !!
#
# Input:
#   suite  — quale suite eseguire:
#             "unit-integration"  blocca merge  (default)
#             "e2e-smoke"         blocca merge
#             "fuzz"              informativo
#             "performance"       informativo
#             "e2e-full"          sessione AA completa
#             "all"               tutte e 5
#
# Job:
#   1. unit-integration  — marker unit|integration + coverage ≥ 80%  [blocca merge]
#   2. e2e-smoke         — marker e2e_smoke                           [blocca merge]
#   3. fuzz              — marker fuzz (Hypothesis)                   [informativo]
#   4. performance       — marker performance                         [informativo]
#   5. e2e-full          — sessione AA completa                       [informativo]
#
# Secrets richiesti:
#   CODECOV_TOKEN  — da https://app.codecov.io → repo settings → token
# ---------------------------------------------------------------------------

name: Test Suite

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite da eseguire"
        required: true
        default: "unit-integration"
        type: choice
        options:
          - "unit-integration"
          - "e2e-smoke"
          - "fuzz"
          - "performance"
          - "e2e-full"
          - "all"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  PIP_CACHE_DIR: ~/.cache/pip

# ===========================================================================
jobs:
# ===========================================================================

  # -------------------------------------------------------------------------
  # JOB 1 — Unit + Integration  (blocca merge)
  # -------------------------------------------------------------------------
  unit-integration:
    name: "Unit & Integration (≥ 80% coverage)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event.inputs.suite == 'unit-integration' ||
      github.event.inputs.suite == 'all'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libzmq3-dev \
            dbus \
            libdbus-1-dev \
            libglib2.0-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/tests/requirements-test.txt
          if [ -f v2/pyproject.toml ] || [ -f v2/setup.py ]; then
            pip install -e v2/
          fi

      - name: Start D-Bus session (per test bluetooth)
        run: |
          eval $(dbus-launch --sh-syntax)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV

      - name: Run unit + integration tests
        run: |
          pytest \
            -m "unit or integration" \
            --cov=v2 \
            --cov-report=xml:coverage.xml \
            --cov-report=html:coverage-html \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --timeout=30 \
            -v \
            --tb=short \
            -p no:warnings
        env:
          QT_QPA_PLATFORM: offscreen
          HYPOTHESIS_SEED: 0

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unit-integration
          name: NemoHeadUnit-v2
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Post coverage comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERAGE_DATA_FILE: coverage.xml
          ANNOTATE_MISSING_LINES: true
          ANNOTATION_TYPE: warning

      - name: Upload coverage report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage-html/
          retention-days: 14

      - name: Coverage summary (log)
        if: always()
        run: |
          python -c "
          import xml.etree.ElementTree as ET, sys
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          pct = float(root.attrib.get('line-rate', 0)) * 100
          print(f'Coverage: {pct:.1f}%')
          sys.exit(0 if pct >= 80 else 1)
          "

  # -------------------------------------------------------------------------
  # JOB 2 — E2E Smoke  (blocca merge)
  # -------------------------------------------------------------------------
  e2e-smoke:
    name: "E2E Smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event.inputs.suite == 'e2e-smoke' ||
      github.event.inputs.suite == 'all'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libzmq3-dev \
            bluez \
            bluetooth

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/tests/requirements-test.txt
          if [ -f v2/pyproject.toml ] || [ -f v2/setup.py ]; then
            pip install -e v2/
          fi

      - name: Run E2E smoke tests
        run: |
          pytest \
            -m e2e_smoke \
            --timeout=60 \
            -v \
            --tb=short
        env:
          QT_QPA_PLATFORM: offscreen

  # -------------------------------------------------------------------------
  # JOB 3 — Fuzz  (informativo, non blocca merge)
  # -------------------------------------------------------------------------
  fuzz:
    name: "Fuzz (Hypothesis)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event.inputs.suite == 'fuzz' ||
      github.event.inputs.suite == 'all'
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/tests/requirements-test.txt
          if [ -f v2/pyproject.toml ] || [ -f v2/setup.py ]; then
            pip install -e v2/
          fi

      - name: Restore Hypothesis database
        uses: actions/cache@v4
        with:
          path: .hypothesis
          key: hypothesis-db-${{ github.ref_name }}
          restore-keys: hypothesis-db-main

      - name: Run fuzz tests
        run: |
          pytest \
            -m fuzz \
            --timeout=60 \
            -v \
            --tb=short \
            -p no:warnings
        env:
          HYPOTHESIS_SEED: ${{ github.run_number }}

      - name: Save Hypothesis database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .hypothesis
          key: hypothesis-db-${{ github.ref_name }}

      - name: Upload fuzz artifacts (failing examples)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-failures
          path: .hypothesis/
          retention-days: 30

  # -------------------------------------------------------------------------
  # JOB 4 — Performance  (informativo, non blocca merge)
  # -------------------------------------------------------------------------
  performance:
    name: "Performance Benchmarks"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event.inputs.suite == 'performance' ||
      github.event.inputs.suite == 'all'
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libzmq3-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/tests/requirements-test.txt
          pip install pytest-json-report
          if [ -f v2/pyproject.toml ] || [ -f v2/setup.py ]; then
            pip install -e v2/
          fi

      - name: Run performance benchmarks
        run: |
          pytest \
            -m performance \
            --timeout=120 \
            -v \
            --tb=short \
            --json-report \
            --json-report-file=perf-results.json
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: perf-results.json
          retention-days: 30

  # -------------------------------------------------------------------------
  # JOB 5 — E2E Full (solo on-demand, non blocca merge)
  # -------------------------------------------------------------------------
  e2e-full:
    name: "E2E Full Session"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event.inputs.suite == 'e2e-full' ||
      github.event.inputs.suite == 'all'
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libzmq3-dev bluez bluetooth
          python -m pip install --upgrade pip
          pip install -r v2/tests/requirements-test.txt
          if [ -f v2/pyproject.toml ] || [ -f v2/setup.py ]; then
            pip install -e v2/
          fi

      - name: Run E2E full session tests
        run: |
          pytest \
            -m e2e_full \
            --timeout=120 \
            -v \
            --tb=long
        env:
          QT_QPA_PLATFORM: offscreen
