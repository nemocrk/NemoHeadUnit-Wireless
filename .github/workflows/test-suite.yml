# ---------------------------------------------------------------------------
# NemoHeadUnit-Wireless — CI Test Suite
# Rif: docs/TEST_SUITE_ARCHITECTURE.md, docs/roadmap-current.md v3.5
#
# !! SOLO ON-DEMAND via workflow_dispatch !!
#
# Input:
#   suite  — quale suite eseguire:
#             "unit-integration"  blocca merge  (default)
#             "e2e-smoke"         blocca merge
#             "fuzz"              informativo
#             "performance"       informativo
#             "e2e-full"          sessione AA completa
#             "all"               tutte e 5
#
# Job:
#   1. unit-integration  — marker unit|integration + coverage ≥ 80%  [blocca merge]
#   2. e2e-smoke         — marker e2e_smoke                           [blocca merge]
#   3. fuzz              — marker fuzz (Hypothesis)                   [informativo]
#   4. performance       — marker performance                         [informativo]
#   5. e2e-full          — sessione AA completa                       [informativo]
#
# Nessun secret esterno richiesto.
# Il badge coverage.svg viene committato automaticamente in docs/badges/.
# ---------------------------------------------------------------------------

name: Test Suite

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite da eseguire"
        required: true
        default: "unit-integration"
        type: choice
        options:
          - "unit-integration"
          - "e2e-smoke"
          - "fuzz"
          - "performance"
          - "e2e-full"
          - "all"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ===========================================================================
jobs:
# ===========================================================================

  # -------------------------------------------------------------------------
  # JOB 1 — Unit + Integration  (blocca merge)
  # -------------------------------------------------------------------------
  unit-integration:
    name: "Unit & Integration (≥ 80% coverage)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    if: |
      github.event.inputs.suite == 'unit-integration' ||
      github.event.inputs.suite == 'all'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true
          post-cleanup: all

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libzmq3-dev \
            dbus \
            libdbus-1-dev \
            libglib2.0-dev

      - name: Install test dependencies
        shell: bash -el {0}
        run: pip install "v2/[test]"

      - name: Start D-Bus session (per test bluetooth)
        run: |
          eval $(dbus-launch --sh-syntax)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV

      - name: Run unit + integration tests
        shell: bash -el {0}
        run: |
          pytest \
            --rootdir=. \
            -c v2/pyproject.toml \
            v2/tests/ \
            -m "unit or integration" \
            -n auto \
            --cov=. \
            --cov-config=v2/pyproject.toml \
            --cov-report=xml:coverage.xml \
            --cov-report=html:coverage-html \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --timeout=30 \
            -v \
            --tb=short \
            -p no:warnings
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
          HYPOTHESIS_SEED: 0

      - name: Generate coverage badge SVG
        if: always()
        shell: bash -el {0}
        run: |
          mkdir -p docs/badges
          python - <<'EOF'
          import xml.etree.ElementTree as ET, sys, pathlib

          cov_file = pathlib.Path("coverage.xml")
          if not cov_file.exists():
              pct = 0.0
          else:
              root = ET.parse(cov_file).getroot()
              pct = float(root.attrib.get("line-rate", 0)) * 100

          if pct >= 90:   color = "#4c1"
          elif pct >= 80: color = "#97ca00"
          elif pct >= 60: color = "#dfb317"
          else:           color = "#e05d44"

          label = "coverage"
          value = f"{pct:.0f}%"
          lw, vw = 62, len(value) * 7 + 10
          tw = lw + vw

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg" width="{tw}" height="20">
            <linearGradient id="s" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <rect rx="3" width="{tw}" height="20" fill="#555"/>
            <rect rx="3" x="{lw}" width="{vw}" height="20" fill="{color}"/>
            <rect rx="3" width="{tw}" height="20" fill="url(#s)"/>
            <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11">
              <text x="{lw//2}" y="15" fill="#010101" fill-opacity=".3">{label}</text>
              <text x="{lw//2}" y="14">{label}</text>
              <text x="{lw + vw//2}" y="15" fill="#010101" fill-opacity=".3">{value}</text>
              <text x="{lw + vw//2}" y="14">{value}</text>
            </g>
          </svg>"""

          pathlib.Path("docs/badges/coverage.svg").write_text(svg)
          print(f"Badge generato: {pct:.0f}%")
          EOF

      - name: Commit coverage badge
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/badges/coverage.svg
          git diff --cached --quiet || git commit -m "ci: aggiorna coverage badge [skip ci]"
          git push

      - name: Upload coverage report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage-html/
          retention-days: 14

      - name: Coverage summary (log)
        if: always()
        shell: bash -el {0}
        run: |
          python -c "
          import xml.etree.ElementTree as ET, sys
          try:
              root = ET.parse('coverage.xml').getroot()
              pct = float(root.attrib.get('line-rate', 0)) * 100
              print(f'Coverage: {pct:.1f}%')
              sys.exit(0 if pct >= 80 else 1)
          except FileNotFoundError:
              print('coverage.xml non trovato')
              sys.exit(1)
          "

  # -------------------------------------------------------------------------
  # JOB 2 — E2E Smoke  (blocca merge)
  # -------------------------------------------------------------------------
  e2e-smoke:
    name: "E2E Smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event.inputs.suite == 'e2e-smoke' ||
      github.event.inputs.suite == 'all'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true
          post-cleanup: all

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libzmq3-dev \
            bluez \
            bluetooth

      - name: Install test dependencies
        shell: bash -el {0}
        run: pip install "v2/[test]"

      - name: Run E2E smoke tests
        shell: bash -el {0}
        run: |
          pytest \
            --rootdir=. \
            -c v2/pyproject.toml \
            v2/tests/ \
            -m e2e_smoke \
            --timeout=60 \
            -v \
            --tb=short
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen

  # -------------------------------------------------------------------------
  # JOB 3 — Fuzz  (informativo, non blocca merge)
  # -------------------------------------------------------------------------
  fuzz:
    name: "Fuzz (Hypothesis)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event.inputs.suite == 'fuzz' ||
      github.event.inputs.suite == 'all'
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true
          post-cleanup: all

      - name: Install test dependencies
        shell: bash -el {0}
        run: pip install "v2/[test]"

      - name: Restore Hypothesis database
        uses: actions/cache@v4
        with:
          path: .hypothesis
          key: hypothesis-db-${{ github.ref_name }}
          restore-keys: hypothesis-db-main

      - name: Run fuzz tests
        shell: bash -el {0}
        run: |
          pytest \
            --rootdir=. \
            -c v2/pyproject.toml \
            v2/tests/ \
            -m fuzz \
            --timeout=60 \
            -v \
            --tb=short \
            -p no:warnings
        env:
          PYTHONPATH: .
          HYPOTHESIS_SEED: ${{ github.run_number }}

      - name: Save Hypothesis database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .hypothesis
          key: hypothesis-db-${{ github.ref_name }}

      - name: Upload fuzz artifacts (failing examples)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-failures
          path: .hypothesis/
          retention-days: 30

  # -------------------------------------------------------------------------
  # JOB 4 — Performance  (informativo, non blocca merge)
  # -------------------------------------------------------------------------
  performance:
    name: "Performance Benchmarks"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event.inputs.suite == 'performance' ||
      github.event.inputs.suite == 'all'
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true
          post-cleanup: all

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libzmq3-dev

      - name: Install test dependencies
        shell: bash -el {0}
        run: |
          pip install "v2/[test]"
          pip install pytest-json-report

      - name: Run performance benchmarks
        shell: bash -el {0}
        run: |
          pytest \
            --rootdir=. \
            -c v2/pyproject.toml \
            v2/tests/ \
            -m performance \
            --timeout=120 \
            -v \
            --tb=short \
            --json-report \
            --json-report-file=perf-results.json
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: perf-results.json
          retention-days: 30

  # -------------------------------------------------------------------------
  # JOB 5 — E2E Full (solo on-demand, non blocca merge)
  # -------------------------------------------------------------------------
  e2e-full:
    name: "E2E Full Session"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event.inputs.suite == 'e2e-full' ||
      github.event.inputs.suite == 'all'
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true
          post-cleanup: all

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libzmq3-dev bluez bluetooth

      - name: Install test dependencies
        shell: bash -el {0}
        run: pip install "v2/[test]"

      - name: Run E2E full session tests
        shell: bash -el {0}
        run: |
          pytest \
            --rootdir=. \
            -c v2/pyproject.toml \
            v2/tests/ \
            -m e2e_full \
            --timeout=120 \
            -v \
            --tb=long
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
