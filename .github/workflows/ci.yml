# ===========================================================================
# NemoHeadUnit-Wireless — Continuous Integration (CI)
# Automated validation on push & pull request across Linux and Windows
# ===========================================================================

name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - dev
      - 'release/**'
  pull_request:
    branches:
      - main
      - master
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # -------------------------------------------------------------------------
  # JOB 1 — Code Quality & Linting
  # -------------------------------------------------------------------------
  lint:
    name: "Code Quality & Lint (Ruff)"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linting
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

  # -------------------------------------------------------------------------
  # JOB 2 — Ubuntu Test Suite (Unit + Integration + Smoke)
  # -------------------------------------------------------------------------
  test-linux:
    name: "Linux Tests & Coverage (Ubuntu)"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true
          post-cleanup: all

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libzmq3-dev \
            dbus \
            libdbus-1-dev \
            libglib2.0-dev

      - name: Install Test Dependencies
        shell: bash -el {0}
        run: pip install ".[test]"

      - name: Start D-Bus Test Session
        run: |
          eval $(dbus-launch --sh-syntax)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV

      - name: Run Unit and Integration Tests
        shell: bash -el {0}
        run: |
          pytest -m "unit or integration or e2e_smoke" \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-linux
          path: coverage.xml
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # JOB 3 — Windows Cross-Platform Unit Tests
  # -------------------------------------------------------------------------
  test-windows:
    name: "Windows Unit Tests"
    needs: [lint]
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Windows Core Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyzmq pyyaml cryptography protobuf pytest pytest-asyncio pytest-timeout pytest-xdist hypothesis

      - name: Run Windows Compatible Unit Tests
        shell: pwsh
        env:
          PYTHONPATH: ".;backend;protos"
        run: |
          pytest tests/unit/ -m "unit and not dbus and not hardware" --tb=short

  # -------------------------------------------------------------------------
  # JOB 4 — Shell Script & Packaging Validation
  # -------------------------------------------------------------------------
  packaging-check:
    name: "Packaging & Scripts Syntax Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Shell Scripts Syntax
        run: |
          for script in scripts/*.sh packaging/*.sh distribute.sh; do
            if [ -f "$script" ]; then
              bash -n "$script"
            fi
          done
          echo "All shell scripts passed syntax check."
