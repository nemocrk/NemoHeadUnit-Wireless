<!-- /etc/dbus-1/system.d/org.nemo.APManager.conf

     D-Bus bus-level policy for the org.nemo.APManager service.

     This file controls WHO CAN CONNECT to the bus name and send/receive
     messages.  Fine-grained action authorisation is handled by PolicyKit
     (see org.nemo.APManager.policy).

     Install:
       sudo cp org.nemo.APManager.conf /etc/dbus-1/system.d/
       sudo systemctl reload dbus  (or reboot)
-->

<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<busconfig>

  <!-- The service itself (runs as root) can own the bus name,
       talk to org.nemo.APManager, and call PolicyKit to authorise callers.
       Both send (outbound call) and receive (reply back from polkitd)
       must be explicitly allowed — D-Bus enforces each direction
       independently. -->
  <policy user="root">
    <allow own="org.nemo.APManager"/>
    <allow send_destination="org.nemo.APManager"/>
    <allow receive_sender="org.nemo.APManager"/>

    <!-- Outbound CheckAuthorization call to polkitd -->
    <allow send_destination="org.freedesktop.PolicyKit1"
           send_interface="org.freedesktop.PolicyKit1.Authority"
           send_member="CheckAuthorization"/>

    <!-- Inbound reply from polkitd (uid=981) back to this service (uid=0).
         Without this rule dbus drops the response with:
         "Rejected receive message ... destination=<ap_manager> (uid=0)
          ... sender=<polkitd> (uid=981)" -->
    <allow receive_sender="org.freedesktop.PolicyKit1"/>
  </policy>

  <!-- Members of the ap_manager group can call methods and receive signals.
       Actual per-action authorisation is still delegated to PolicyKit. -->
  <policy group="ap_manager">
    <allow send_destination="org.nemo.APManager"
           send_interface="org.nemo.APManager"/>
    <allow receive_sender="org.nemo.APManager"/>
  </policy>

  <!-- Allow default context (all users) to send/receive messages to the service.
       Actual per-action authorisation is delegated to PolicyKit. -->
  <policy context="default">
    <allow send_destination="org.nemo.APManager"/>
    <allow receive_sender="org.nemo.APManager"/>
  </policy>

</busconfig>
