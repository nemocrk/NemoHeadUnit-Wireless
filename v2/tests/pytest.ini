[pytest]
# ---------------------------------------------------------------------------
# NemoHeadUnit-Wireless v2 — pytest configuration
# Rif: docs/TEST_SUITE_ARCHITECTURE.md §5
# ---------------------------------------------------------------------------

testpaths = v2/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ---------------------------------------------------------------------------
# Marker registrati
# ---------------------------------------------------------------------------
markers =
    unit: test isolato, nessun I/O reale (< 1s per test)
    integration: più moduli reali con bus in-process (< 10s per test)
    e2e: flusso end-to-end con stack completo o phone mock
    e2e_smoke: subset e2e veloci (< 30s totali) — run in CI standard
    e2e_full: sessione AA completa, > 60s — run separato nightly/on-demand
    performance: benchmark informativi, non falliscono per soglie
    hardware: richiede hardware fisico (audio, BT, display)
    qt: richiede QApplication offscreen
    dbus: richiede sessione D-Bus di test
    slow: atteso > 10s
    fuzz: property-based con Hypothesis

# ---------------------------------------------------------------------------
# Warnings filter
# ---------------------------------------------------------------------------
filterwarnings =
    ignore::DeprecationWarning:zmq.*
    ignore::ResourceWarning

# ---------------------------------------------------------------------------
# Default options
# ---------------------------------------------------------------------------
addopts =
    --strict-markers
    --tb=short
    -q

# ---------------------------------------------------------------------------
# Timeout options
# ---------------------------------------------------------------------------
timeout = 60
timeout_method = thread
timeout_func_only = true
