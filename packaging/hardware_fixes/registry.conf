# hardware_fixes/registry.conf
#
# Formato (una regola per riga, campi separati da '::'):
#   <detect_cmd> :: <fix_script>
#
# detect_cmd : comando shell (può contenere pipe); exit 0 = piattaforma rilevata
# fix_script : path relativo a questa directory; deve essere eseguibile
#
# Regole:
#   - Le righe che iniziano con '#' o vuote sono ignorate
#   - detect_cmd viene eseguito con bash -c (supporta pipe, grep, ecc.)
#   - fix_script viene eseguito come root (già nel contesto postinst/install.sh)
#   - L'ordine conta: i fix vengono applicati nell'ordine in cui appaiono
#   - Il separatore '::' non può apparire in detect_cmd o fix_script
#
# Esempio aggiungere una nuova piattaforma:
#   grep -qi "MyDevice" /sys/class/dmi/id/product_name 2>/dev/null :: fix_mydevice.sh

grep -Eiq "(HP Omni ?10|Omni10)" /sys/class/dmi/id/product_name 2>/dev/null || (command -v dmidecode &>/dev/null && dmidecode -s system-product-name | grep -Eiq "(HP Omni ?10|Omni10)") :: fix_omni10.sh
true :: fix_gpu_drivers.sh
