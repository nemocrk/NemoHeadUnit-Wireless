# NemoHeadUnit-Wireless — Micromamba Environment Specification (Linux)
#
# NOTE: conda environment.yml does NOT support platform selectors.
#       Use environment.yml for Linux, environment.windows.yml for Windows.
#
# Create:   micromamba create -f environment.yml
# Activate: micromamba activate NemoHeadUnit-Wireless
# Update:   micromamba update -f environment.yml --prune

name: NemoHeadUnit-Wireless

channels:
  - conda-forge
  - nodefaults

dependencies:
  # ── Core runtime ──────────────────────────────────────────────
  - python=3.13
  - pyzmq>=26.0
  - msgpack-python>=1.0
  - aiohttp>=3.9.0
  - websockets>=12.0
  - pyyaml>=6.0
  - numpy
  - ffmpeg          # HW-accelerated video transcode for mjpeg-ffmpeg transport
  - pip

  # ── Linux: DBus / GObject / GStreamer / Qt6 ───────────────────
  - dbus-python
  - pygobject
  - gstreamer>=1.22
  - gst-plugins-base>=1.22
  - gst-plugins-good>=1.22
  - gst-plugins-bad>=1.22
  - gst-plugins-ugly>=1.22
  - gst-libav>=1.22
  - pyopengl
  - pyqt6>=6.6.0

  - pip:
      - loguru>=0.7.3
      - protobuf>=4.25
      - grpcio-tools>=1.62
      - PyQt6>=6.6.0
      - PySide6>=6.6.0
      - shiboken6>=6.6.0
      - qasync>=0.27.1
      - av>=10.0.0
