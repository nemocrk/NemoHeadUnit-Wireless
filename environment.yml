# NemoHeadUnit-Wireless — Conda environment
#
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
# Activate: conda activate py314

name: py314

channels:
  - conda-forge
  - defaults

dependencies:
  # -----------------------------------------------------------------------
  # Python runtime
  # -----------------------------------------------------------------------
  - python=3.14

  # -----------------------------------------------------------------------
  # IPC / Message bus
  # -----------------------------------------------------------------------
  - pyzmq>=26.0          # ZeroMQ bindings (bus_broker + BusClient)
  - msgpack-python>=1.0  # Frame serialisation (conda-forge package name)

  # -----------------------------------------------------------------------
  # GUI
  # -----------------------------------------------------------------------
  - pyqt6>=6.7           # Qt6 bindings + QtBusBridge
  - pyopengl              # OpenGL bindings per _NV12GLWidget (GLSL renderer)

  # -----------------------------------------------------------------------
  # Bluetooth / DBus (system packages preferred; pip fallback below)
  # -----------------------------------------------------------------------
  - dbus-python           # Python DBus bindings for BluetoothManager

  # -----------------------------------------------------------------------
  # Media — GStreamer stack
  #
  # gst-python porta il binding gi.repository.Gst ma NON i plugin codec.
  # I tre pacchetti sotto portano nell'env conda gli stessi plugin
  # disponibili di sistema, evitando il GST_PLUGIN_PATH mismatch tra
  # base e py314.
  #
  # Decoder H264 disponibili dopo l'installazione:
  #   avdec_h264   — FFmpeg SW decode       (da gst-libav)
  #                  NB: su conda-forge il pacchetto si chiama gst-libav.
  #   vaapih264dec — VA-API HW decode i965  (da gst-plugins-vaapi)
  #                  Stabile su Bay Trail con driver i965.
  #                  NB: usare vaapih264dec, NON vaapidecodebin
  #                  (vaapidecodebin usa DMA-buf e triggera assert i965).
  #   vah264dec    — VA-API HW decode iHD   (da gst-plugins-vaapi)
  #                  Non disponibile su Bay Trail (iHD init failed).
  #   h264parse    — già incluso in gst-plugins-bad
  #
  # Se preferisci restare sui plugin di sistema ed evitare la duplicazione,
  # rimuovi i tre pacchetti sotto e imposta invece:
  #   export GST_PLUGIN_PATH=/usr/lib/x86_64-linux-gnu/gstreamer-1.0
  # -----------------------------------------------------------------------
  - gst-python            # gi.repository.Gst Python bindings (conda-forge)
  - gst-libav             # avdec_h264 — FFmpeg SW H264 decoder
  - gst-plugins-vaapi     # vaapih264dec / vah264dec — VA-API HW H264 decoder
  - gst-plugins-bad       # h264parse, qsv encoder, ecc.

  # -----------------------------------------------------------------------
  # Audio backend (channel_modules/audio)
  #
  # PCM output is handled by pacat (PulseAudio/PipeWire) — a system tool,
  # NOT a Python package.  Install via:
  #   sudo apt install pulseaudio-utils
  # pacat writes directly to the PipeWire/PulseAudio daemon, avoiding
  # PortAudio/ALSA exclusive-access conflicts.
  #
  # Per-channel volume is controlled via:
  #   pactl set-sink-input-volume <sink-input-index> <vol>%
  # -----------------------------------------------------------------------
  - av>=12.0              # PyAV — FFmpeg bindings for AAC-LC ADTS decoding

  # -----------------------------------------------------------------------
  # Configuration persistence
  # -----------------------------------------------------------------------
  - pyyaml>=6.0           # YAML read/write for config_manager module

  # -----------------------------------------------------------------------
  # Utilities
  # -----------------------------------------------------------------------
  - pip

  - pip:
    # msgpack is also available via pip if conda-forge version lags
    - msgpack>=1.0.8
    # GStreamer Python overrides fallback (if gst-python not in conda)
    # - PyGObject>=3.46
    # Protobuf compiler — needed to run scripts/compile_protos.sh
    # Generates *_pb2.py from .proto files in third_party/open-android-auto
    - grpcio-tools>=1.62
    - protobuf>=4.25
    # Logging — async structured logger (Python 3.14 compatible); replaces logly
    - loguru>=0.7.3
