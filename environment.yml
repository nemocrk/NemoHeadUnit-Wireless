# NemoHeadUnit-Wireless — Micromamba Environment Specification
#
# Create:   micromamba create -f environment.yml
# Activate: micromamba activate NemoHeadUnit-Wireless
# Update:   micromamba update -f environment.yml --prune

name: NemoHeadUnit-Wireless

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.13
  - pyzmq>=26.0
  - msgpack-python>=1.0
  - aiohttp>=3.9.0
  - websockets>=12.0
  - dbus-python
  - pygobject
  - gstreamer>=1.22
  - gst-plugins-base>=1.22
  - gst-plugins-good>=1.22
  - gst-plugins-bad>=1.22
  - gst-plugins-ugly>=1.22
  - gst-libav>=1.22
  - pyyaml>=6.0
  - ffmpeg # HW-accelerated video transcode for mjpeg-ffmpeg transport
  - pyopengl
  - numpy
  - pip

  - pip:
      - PyQt6>=6.6.0
      - loguru>=0.7.3
      - protobuf>=4.25
      - grpcio-tools>=1.62
      - qasync>=0.27.1
      - av>=10.0.0



